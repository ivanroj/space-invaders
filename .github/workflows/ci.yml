name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./cmd/wasm
      - name: Test
        run: go test -race ./...
      - name: Build the Wasm package
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/
